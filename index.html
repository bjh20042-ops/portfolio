<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="방준혁 — 자동화 제어 엔지니어 지망. PLC 시퀀스 제어와 AI 비전·예지보전을 융합하는 스마트 팩토리 포트폴리오.">
  <meta property="og:title" content="방준혁 — Automation Control Engineer">
  <meta property="og:description" content="PLC 제어 + AI 데이터 분석. 조선대학교 인공지능공학전공.">
  <meta property="og:type" content="website">
  <title>Loading…</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body id="top">
  <a class="skip-link" href="#main">본문으로 이동</a>

  <header class="site-header">
    <nav class="nav wrap" aria-label="Primary">
      <a class="brand" href="#top">
        <span class="dot" aria-hidden="true"></span>
        <span data-brand-name>BJH</span>
        <small>Automation × AI</small>
      </a>
      <div class="nav-links" data-nav-links></div>
      <button class="nav-toggle" aria-label="메뉴 토글">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </nav>
  </header>

  <main id="main">

    <!-- HERO -->
    <section class="hero wrap">
      <div class="hero-grid">
        <div>
          <span class="hero-eyebrow"><span class="ln" aria-hidden="true"></span><span class="mono" data-hero-eyebrow></span></span>
          <h1 data-hero-lines></h1>
          <p class="hero-intro" data-hero-intro></p>
          <div class="hero-cta" data-hero-cta></div>
        </div>
        <aside class="hero-panel" data-hero-panel aria-label="프로필 요약"></aside>
      </div>
      <div class="scroll-hint" aria-hidden="true">
        <span class="mouse"><span></span></span>
        <span class="mono">SCROLL</span>
      </div>
    </section>

    <!-- ABOUT -->
    <section class="block wrap" id="about" aria-labelledby="about-t">
      <div class="sec-head" data-head>
        <span class="idx"><span data-idx></span> <span data-eyebrow class="mono"></span></span>
        <h2 id="about-t" data-title></h2>
      </div>
      <div class="sec-rule"></div>
      <div class="about-grid">
        <div>
          <p class="about-lead reveal" data-about-lead></p>
          <p class="about-body reveal" data-d="1" data-about-body></p>
          <div class="about-stack reveal" data-d="2" data-about-stack></div>
        </div>
        <dl class="fact-card reveal" data-d="1" data-about-facts></dl>
      </div>
    </section>

    <!-- EDUCATION -->
    <section class="block wrap" id="education" aria-labelledby="edu-t">
      <div class="sec-head" data-head>
        <span class="idx"><span data-idx></span> <span data-eyebrow class="mono"></span></span>
        <h2 id="edu-t" data-title></h2>
      </div>
      <div class="sec-rule"></div>
      <div data-edu></div>
    </section>

    <!-- SKILLS -->
    <section class="block wrap" id="skills" aria-labelledby="skills-t">
      <div class="sec-head" data-head>
        <span class="idx"><span data-idx></span> <span data-eyebrow class="mono"></span></span>
        <h2 id="skills-t" data-title></h2>
        <p class="note" data-note></p>
      </div>
      <div class="sec-rule"></div>
      <div class="skills-grid" data-skills></div>
    </section>

    <!-- PROJECTS -->
    <section class="block wrap" id="projects" aria-labelledby="proj-t">
      <div class="sec-head" data-head>
        <span class="idx"><span data-idx></span> <span data-eyebrow class="mono"></span></span>
        <h2 id="proj-t" data-title></h2>
        <p class="note" data-note></p>
      </div>
      <div class="sec-rule"></div>
      <div style="display:grid;gap:1.2rem" data-projects></div>
    </section>

    <!-- EXPERIENCE -->
    <section class="block wrap" id="experience" aria-labelledby="exp-t">
      <div class="sec-head" data-head>
        <span class="idx"><span data-idx></span> <span data-eyebrow class="mono"></span></span>
        <h2 id="exp-t" data-title></h2>
      </div>
      <div class="sec-rule"></div>
      <div data-experience></div>
    </section>

    <!-- CAREER -->
    <section class="block wrap" id="career" aria-labelledby="career-t">
      <div class="sec-head" data-head>
        <span class="idx"><span data-idx></span> <span data-eyebrow class="mono"></span></span>
        <h2 id="career-t" data-title></h2>
      </div>
      <div class="sec-rule"></div>
      <div class="career-grid" data-career></div>
    </section>

    <!-- CONTACT -->
    <section class="block wrap" id="contact" aria-labelledby="contact-t">
      <div class="sec-head" data-head>
        <span class="idx"><span data-idx></span> <span data-eyebrow class="mono"></span></span>
        <h2 id="contact-t" data-title></h2>
      </div>
      <div class="sec-rule"></div>
      <div class="contact-grid">
        <div class="contact-main reveal">
          <p data-contact-body></p>
          <div class="contact-list" data-contact-list></div>
        </div>
        <div class="contact-cta reveal" data-d="1">
          <h3>Resume</h3>
          <p>제어와 데이터를 함께 다루는 엔지니어로 성장하고 있습니다.</p>
          <a class="btn primary" data-contact-resume href="./resume.pdf" style="align-self:flex-start">Download Resume <span class="arr">↓</span></a>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="footer-grid wrap">
      <span class="copy" data-footer-copy></span>
      <span class="status-now"><span class="live-dot"></span> Currently at GitHub</span>
      <span class="local-clock" data-clock>--:-- Local</span>
    </div>
  </footer>

  <button class="to-top" aria-label="맨 위로">
    <svg class="ring" viewBox="0 0 50 50"><circle cx="25" cy="25" r="24" pathLength="1"></circle></svg>
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <script src="./assets/js/render.js" defer></script>
  <script src="./assets/js/interactions.js" defer></script>
</body>
</html>
